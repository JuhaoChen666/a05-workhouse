[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emo2vec-agent"
version = "0.1.0"
description = "FastAPI + LangChain AI Agent with DeepSeek and ModelScope"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["fastapi", "langchain", "ai-agent", "deepseek", "modelscope"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    
    # LangChain v1.0
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    
    # LLM Providers
    "openai>=1.55.0",
    "modelscope>=1.20.0",
    
    # Data Models & Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.6,<4",
    
    # Async & HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.11.0",
    "aiosqlite>=0.20.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    
    # Vector Store
    "chromadb>=0.5.0",
    "milvus-lite>=2.4.0",
    
    # Cache
    "redis>=5.2.0",
    
    # Message Queue
    "celery>=5.4.0",
    
    # Storage
    "minio>=7.2.0",
    
    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    
    # Development
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_default_fixture_loop_scope = "function"
cache_dir = "../.phase1-local/pytest-restart-cache"

# 基础配置
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       8081;
        server_name  localhost 127.0.0.1 47.99.110.72;

        # 前端静态文件路径
        root   H:/Code/program/2026外包/a05-workhouse/frontend/dist;
        index  index.html;

        # 后端返回的小写头像路径（如 /assets/avatar_xxx.webp）
        # 使用 ^~ 提升优先级，避免被下面通用静态资源正则拦截
        location ^~ /assets/avatar_ {
            proxy_pass http://10.105.2.13:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # 静态资源缓存（解决 MIME 类型问题）
        # =========================
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # =========================
        # Spring Boot (8080) 代理配置
        # =========================
        location /auth/ {
            proxy_pass http://10.105.2.13:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://10.105.2.13:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/ {
            proxy_pass http://10.105.2.13:8080/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /jobs/ {
            proxy_pass http://10.105.2.13:8080/jobs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /positions/ {
            proxy_pass http://10.105.2.13:8080/positions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /report/ {
            proxy_pass http://10.105.2.13:8080/report/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /interview-record/ {
            proxy_pass http://10.105.2.13:8080/interview-record/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /question-bank/ {
            proxy_pass http://10.105.2.13:8080/question-bank/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /learning-resource/ {
            proxy_pass http://10.105.2.13:8080/learning-resource/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /Assets/ {
            proxy_pass http://10.105.2.13:8080/Assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # FastAPI (8000) 代理配置
        # =========================
        location /api/ {
            proxy_pass http://10.105.2.13:8000/api/;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://10.105.2.13:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://10.105.2.13:8000/openapi.json;
            proxy_set_header Host $host;
        }

        location /data/resumes/ {
            proxy_pass http://10.105.2.13:8000/data/resumes/;
            proxy_set_header Host $host;
        }

        location /ws/ {
            proxy_pass http://10.105.2.13:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # =========================
        # SPA 路由兜底（必须放在最后）
        # =========================
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}